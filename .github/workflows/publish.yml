name: Publish to npm

# Triggered ONLY by pushing a version tag (v*.*.*) — not on every push to main.
# This keeps releases deliberate; merging to main never auto-publishes.
on:
  push:
    tags:
      - 'v*.*.*'

# Prevent two simultaneous tag pushes from racing each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for `npm publish --provenance` (sigstore attestations)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Belt-and-suspenders: refuse to publish if the tag (vX.Y.Z) doesn't match
      # package.json's "version". Prevents a typo from shipping the wrong version.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "tag: $TAG_VERSION   package.json: $PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        # --access public is required for scoped packages and a no-op for unscoped ones;
        # safe to leave in either way. --provenance attaches a sigstore attestation
        # showing the build came from this exact workflow run (visible on npmjs.com).
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tell LivingCV a new jobops shipped so it rebuilds its jobops image and
      # redeploys immediately (LivingCV also re-resolves `latest` on a daily
      # cron, so this step is best-effort). Requires the LIVINGCV_DISPATCH_TOKEN
      # secret: a fine-grained PAT for the LivingCV repo with contents:read +
      # actions/workflows write (or a classic PAT with `repo` scope). Skipped
      # quietly when the secret is not configured.
      - name: Notify LivingCV of the release
        env:
          DISPATCH_TOKEN: ${{ secrets.LIVINGCV_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "LIVINGCV_DISPATCH_TOKEN not set — skipping repository_dispatch (daily cron will pick the release up)."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mohith-das/LivingCV/dispatches \
            -d "{\"event_type\":\"jobops-release\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME#v}\"}}" \
          && echo "Dispatched jobops-release to mohith-das/LivingCV" \
          || echo "::warning::repository_dispatch to LivingCV failed — the daily cron will pick the release up."
